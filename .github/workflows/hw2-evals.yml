name: HW2 RAG Evals & Quality Gate

on:
  push:
    branches: ["hw2", "main", "**"]
  pull_request:
    branches: ["hw2", "main", "**"]

env:
  FASTEMBED_CACHE_PATH: ~/.cache/fastembed
  HF_HOME: ~/.cache/huggingface

jobs:
  rag-evals-gate:
    name: Pytest + Retrieval & RAG Evals Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Cache local ONNX embedding & reranker models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/fastembed
            ~/.cache/huggingface
          key: hw2-onnx-models-v1-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            hw2-onnx-models-v1-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run HW1 + HW2 unit & integration tests
        run: python -m pytest tests -v

      - name: Build local Qdrant vector index & run retrieval evals
        run: |
          python -m src.hw2.index
          python -m src.hw2.eval_retrieval

      - name: Run calibrated judge & end-to-end RAG CI quality gate
        run: |
          python -m src.hw2.eval_rag \
            --min-overall-score 0.85 \
            --min-faithfulness 0.90 \
            --min-abstention-accuracy 0.90 \
            --min-judge-agreement 0.85

      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hw2-eval-results
          path: |
            evals/hw2_retrieval_results.json
            evals/hw2_judge_calibration_results.json
            evals/hw2_rag_eval_results.json
